name: UK London Fleet Reels & Video Automation

on:
  schedule:
    # 4 Scheduled runs per day (UK London GMT/BST staggered hours)
    - cron: '15 9 * * *'   # 09:15 AM UK
    - cron: '15 13 * * *'  # 01:15 PM UK
    - cron: '15 17 * * *'  # 05:15 PM UK
    - cron: '45 21 * * *'  # 09:45 PM UK
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without posting (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  upload-fleet-uk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wireguard resolvconf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Service Account Key
        env:
          SA_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_KEY" ]; then
            echo "$SA_KEY" > service_account.json
            chmod 600 service_account.json
          fi

      - name: Connect WireGuard UK London VPN (Anti-Ban)
        env:
          WIREGUARD_CONFIG_UK: ${{ secrets.WIREGUARD_CONFIG_UK }}
        run: |
          bash scripts/connect_wireguard_uk.sh || echo "WireGuard skipped or configured without VPN"

      - name: Run UK London Posting Engine
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGES_TOKENS_JSON: ${{ secrets.FB_PAGES_TOKENS_JSON }}
          GDRIVE_USER_TOKEN_JSON: ${{ secrets.GDRIVE_USER_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python main.py --config config_uk_account1.yaml $DRY_FLAG

      - name: Commit & Push Updated Database State
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_videos.db data/upload_history.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(telemetry): auto-record uploaded UK reels [skip ci]"
            git push
          fi
